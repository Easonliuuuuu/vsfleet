name: Feature request
description: Suggest a new capability or improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Choose the main area, or other if unsure. This choice controls the area label.
      options:
        - tui
        - assessment
        - compatibility
        - vsphere
        - docs
        - workflows
        - release
        - config
        - deps
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what you are trying to do and what is missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe an approach if you have one. VSFleet is read-only against vSphere; proposals that change infrastructure are out of scope.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe what you do today or other approaches you considered.
    validations:
      required: false
