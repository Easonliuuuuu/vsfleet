name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  docker-build:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: docker/setup-buildx-action@v4

      - name: Build Linux amd64 and arm64 binaries
        run: |
          mkdir -p linux/amd64 linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o linux/amd64/vsfleet ./cmd/vsfleet
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o linux/arm64/vsfleet ./cmd/vsfleet
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o linux/amd64/vsfleet-vcsim ./cmd/vsfleet-vcsim

      - name: Build multi-arch container image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile \
            .

      - name: Smoke test container execution (amd64)
        run: |
          docker build --build-arg TARGETPLATFORM=linux/amd64 -t vsfleet:ci-test .
          docker run --rm vsfleet:ci-test --version
          docker run --rm vsfleet:ci-test --help

      - name: Build vcsim fixture image
        run: docker build -f Dockerfile.vcsim -t vsfleet-vcsim:ci-test .

      - name: Create Kubernetes test cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vsfleet-ci

      - name: Load local images into Kubernetes
        run: kind load docker-image --name vsfleet-ci vsfleet:ci-test vsfleet-vcsim:ci-test

      - name: Run Kubernetes end-to-end workload
        env:
          VSFLEET_K8S_DEBUG_DIR: ${{ runner.temp }}/kubernetes-debug
        run: ./scripts/test-kubernetes.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kubernetes-debug
          path: ${{ runner.temp }}/kubernetes-debug

  integration-vcsim:
    name: Multi-vCenter vcsim integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true

      # govmomi v0.56.0 exposes simulator as a library rather than an
      # installable github.com/vmware/govmomi/vcsim module. This launcher is
      # still an independent OS process and is compiled against that pinned
      # module version from go.mod.
      - name: Build vcsim-compatible launcher
        run: go build -o "${RUNNER_TEMP}/vsfleet-vcsim" ./cmd/vsfleet-vcsim

      - name: Run integration suite
        env:
          VSFLEET_VCSIM_BIN: ${{ runner.temp }}/vsfleet-vcsim
          VSFLEET_VCSIM_REQUIRED: "1"
          VSFLEET_VCSIM_LOG_DIR: ${{ runner.temp }}/vcsim-logs
        run: go test -tags integration -race ./tests/... -timeout 20m

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vcsim-logs
          path: ${{ runner.temp }}/vcsim-logs
