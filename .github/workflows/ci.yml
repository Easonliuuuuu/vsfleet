name: CI

# Documentation-only changes skip this workflow; docs.yml builds the site and
# checks the release pins in README.md and docs/. The test catalogue stays
# included because a Go test checks every scenario and fuzz target has a row.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!mkdocs.yml"
      - "!requirements-docs.txt"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/test-catalog.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "!mkdocs.yml"
      - "!requirements-docs.txt"
      - "!.github/ISSUE_TEMPLATE/**"
      - "docs/test-catalog.md"

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l . )
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test auto labeling
        if: runner.os == 'Linux'
        run: node --test scripts/test-labeler.cjs

      - name: Verify release pins
        if: runner.os == 'Linux'
        run: scripts/check-release-pins.sh

      - name: Vet
        run: go vet ./...

      # The in-process simulator suite lives in tests/ and exercises packages
      # outside that directory. -coverpkg credits that work in the aggregate
      # profile; without it Go reports only package-local coverage.
      - name: Test with coverage
        if: runner.os == 'Linux'
        run: |
          go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo '## Test coverage'
            echo
            echo '```text'
            tail -n 1 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        if: runner.os != 'Linux'
        run: go test -race ./...

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          if-no-files-found: error
          retention-days: 14

      - name: Build
        run: go build ./...

  platform-status:
    name: Publish platform build and test status
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/github-script@v9
        env:
          MATRIX_RESULT: ${{ needs.build.result }}
        with:
          retries: 3
          script: |
            const repo = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', per_page: 1,
            });
            if (data.workflow_runs[0]?.id !== context.runId) {
              core.info('A newer CI run owns the platform badge.');
              return;
            }
            const statuses = {
              success: { message: 'passing', color: 'brightgreen' },
              failure: { message: 'failing', color: 'red' },
              cancelled: { message: 'cancelled', color: 'lightgrey' },
              skipped: { message: 'skipped', color: 'lightgrey' },
            };
            const status = statuses[process.env.MATRIX_RESULT] || { message: 'unknown', color: 'lightgrey' };
            const content = JSON.stringify({
              schemaVersion: 1,
              label: 'Linux · macOS · Windows',
              ...status,
              cacheSeconds: 300,
            }, null, 2) + '\n';
            const branch = 'package-status';
            const path = 'platforms.json';
            try {
              await github.rest.git.getRef({ ...repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...repo, ref: `refs/heads/${branch}`, sha: context.sha });
            }
            let existing;
            try {
              const response = await github.rest.repos.getContent({ ...repo, path, ref: branch });
              existing = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing && Buffer.from(existing.content, 'base64').toString('utf8') === content) {
              core.info('Platform badge is unchanged.');
              return;
            }
            const author = { name: 'Eason Liu', email: 'easoneastin@gmail.com' };
            await github.rest.repos.createOrUpdateFileContents({
              ...repo, path, branch,
              message: 'chore(release): update platform build and test status',
              content: Buffer.from(content).toString('base64'),
              ...(existing ? { sha: existing.sha } : {}),
              author, committer: author,
            });

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  tui-scenarios:
    name: TUI scenario harness
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run deterministic semantic scenarios
        run: go run ./cmd/vsfleet-harness test --results-dir "${{ runner.temp }}/vsfleet-scenarios"
      - name: Upload scenario diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tui-scenario-results-${{ matrix.os }}
          path: ${{ runner.temp }}/vsfleet-scenarios
          if-no-files-found: ignore

  tui-pty:
    name: TUI real-terminal PTY journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Run actual testbed process in a PTY
        run: scripts/testbed pty --results-dir "${{ runner.temp }}/vsfleet-pty"
      - name: Upload PTY failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tui-pty-results
          path: ${{ runner.temp }}/vsfleet-pty
          if-no-files-found: error

  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Mirrors the goreleaser job in release.yml, so a broken .goreleaser.yaml,
      # Dockerfile, or cross-compile fails here instead of at tag time. Both
      # use GO_VERSION, not go.mod: setup-go reads go.mod's `go 1.26.0` as
      # an exact patch release and would build with its unpatched stdlib.
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: docker/setup-buildx-action@v4

      # A snapshot builds and loads one image per platform, and buildx
      # refuses index annotations on a single-platform export. Everything
      # else in this copy is the release configuration unchanged.
      - name: Derive the snapshot configuration
        run: sed 's/"index,manifest:/"manifest:/' .goreleaser.yaml > "${RUNNER_TEMP}/goreleaser-snapshot.yaml"

      - name: Read the base image from the Dockerfile
        run: scripts/base-image-env.sh >> "$GITHUB_ENV"

      - name: Build every release artifact without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign --config ${{ runner.temp }}/goreleaser-snapshot.yaml
        env:
          # Publishers template these tokens even when nothing is pushed.
          TAP_GITHUB_TOKEN: snapshot-unused
          WINGET_GITHUB_TOKEN: snapshot-unused

      - name: Smoke test release binaries, packages, and image
        run: |
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            compgen -G "dist/vsfleet_*_${target}.tar.gz" >/dev/null || compgen -G "dist/vsfleet_*_${target}.zip" >/dev/null || { echo "missing archive for $target"; ls dist; exit 1; }
          done
          for arch in amd64 arm64; do
            compgen -G "dist/vsfleet_*_linux_${arch}.deb" >/dev/null || { echo "missing deb for $arch"; ls dist; exit 1; }
            compgen -G "dist/vsfleet_*_linux_${arch}.rpm" >/dev/null || { echo "missing rpm for $arch"; ls dist; exit 1; }
          done
          for suffix in .yaml .installer.yaml .locale.en-US.yaml; do
            compgen -G "dist/winget/manifests/e/Easonliuuuuu/vsfleet/*/Easonliuuuuu.vsfleet${suffix}" >/dev/null || { echo "missing WinGet manifest $suffix"; exit 1; }
          done
          dist/vsfleet_linux_amd64_v1/vsfleet --version
          image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/easonliuuuuu/vsfleet:' | grep -m1 amd64 || true)"
          image="${image:-$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -m1 '^ghcr.io/easonliuuuuu/vsfleet:')}"
          test -n "$image" || { echo "goreleaser loaded no vsfleet image"; docker image ls; exit 1; }
          docker run --rm --platform linux/amd64 "$image" --version
          docker run --rm --platform linux/amd64 "$image" --help >/dev/null

      - name: Install vulnerability scanners
        run: scripts/install-scanners.sh "${RUNNER_TEMP}/scanners" >> "$GITHUB_PATH"

      # The artifacts a release would publish, scanned as built: every
      # binary for reachable Go vulnerabilities, and each image for OS and
      # bundled Go vulnerabilities. See docs/security-scanning.md.
      - name: Scan release binaries and images
        env:
          RESULTS: ${{ runner.temp }}/vulnerability-results
        run: |
          failed=0
          for bin in dist/vsfleet_*/vsfleet dist/vsfleet_*/vsfleet.exe; do
            [[ -e "$bin" ]] || continue
            target="$(basename "$(dirname "$bin")")"
            scripts/vulnscan govulncheck "snapshot ${target#vsfleet_}" "$RESULTS" -mode binary "$bin" || failed=1
          done
          # One scan per image ID; the snapshot tags each image several ways.
          images="$(docker image ls --format '{{.ID}} {{.Repository}}:{{.Tag}}' | grep ' ghcr.io/easonliuuuuu/vsfleet:' | sort -u -k1,1 | cut -d' ' -f2)"
          test -n "$images"
          for image in $images; do
            scripts/vulnscan grype "snapshot image ${image##*:}" "$RESULTS" "docker:${image}" || failed=1
          done
          exit "$failed"

      - name: Keep scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-results-snapshot
          path: ${{ runner.temp }}/vulnerability-results
          if-no-files-found: ignore
          retention-days: 90

  integration-vcsim:
    name: Multi-vCenter vcsim integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true

      # govmomi v0.56.0 exposes simulator as a library rather than an
      # installable github.com/vmware/govmomi/vcsim module. This launcher is
      # still an independent OS process and is compiled against that pinned
      # module version from go.mod.
      - name: Build vcsim-compatible launcher
        run: go build -o "${RUNNER_TEMP}/vsfleet-vcsim" ./cmd/vsfleet-vcsim

      - name: Run integration suite
        env:
          VSFLEET_VCSIM_BIN: ${{ runner.temp }}/vsfleet-vcsim
          VSFLEET_VCSIM_REQUIRED: "1"
          VSFLEET_VCSIM_LOG_DIR: ${{ runner.temp }}/vcsim-logs
        # The untagged in-process tests in tests/ already ran in the build job.
        run: go test -tags integration -race -run '^TestVCSIM' ./tests/... -timeout 20m

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vcsim-logs
          path: ${{ runner.temp }}/vcsim-logs
