name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time to fuzz each target, up to 1h (Go duration, e.g. 5m or 30s)
        default: 5m
  # A change to a fuzz target, its seeds, or this workflow gets a short
  # campaign before merge instead of waiting for the night.
  pull_request:
    paths:
      - .github/workflows/fuzz.yml
      - "**/fuzz_test.go"
      - "**/testdata/fuzz/**"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"
  FUZZTIME: ${{ github.event_name == 'pull_request' && '1m' || inputs.fuzztime || '5m' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # TUI state machine: arbitrary keys and resizes, reordered async
          # replies, and render bounds.
          - { package: ./internal/tui, target: FuzzTUIKeyResizeNeverPanics }
          - { package: ./internal/tui, target: FuzzStaleMessagesCannotReplaceNewerState }
          - { package: ./internal/tui, target: FuzzRenderIsBoundedAndDeterministic }
          # Parsers for input that comes from outside vsfleet: imported
          # RVTools workbooks, hand-edited configuration, ~/.ssh/config, and
          # --where expressions.
          - { package: ./internal/rvimport, target: FuzzParseWorkbook }
          - { package: ./internal/config, target: FuzzLoadSaveRoundTrip }
          - { package: ./internal/config, target: FuzzNormalizeThumbprintIsIdempotent }
          - { package: ./internal/sshalias, target: FuzzDiscover }
          - { package: ./internal/query, target: FuzzParseAndEvaluate }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime "$FUZZTIME"
      # A failing input is written under the package's testdata/fuzz. Commit
      # it there to keep it as a permanent regression seed.
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}
          if-no-files-found: ignore
