name: Kubernetes deployment

on:
  schedule:
    # Monday 09:17 Asia/Taipei; off the top of the hour.
    - cron: "17 1 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kubernetes.yml"
      - "cmd/vsfleet/**"
      - "cmd/vsfleet-vcsim/**"
      - "internal/**"
      - "!internal/tui/**"
      - "!internal/demo/**"
      - "!internal/uistate/**"
      - "deploy/kubernetes/**"
      - "tests/kubernetes/**"
      - "scripts/test-kubernetes.sh"
      - "Dockerfile"
      - "Dockerfile.vcsim"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/kubernetes.yml"
      - "cmd/vsfleet/**"
      - "cmd/vsfleet-vcsim/**"
      - "internal/**"
      - "!internal/tui/**"
      - "!internal/demo/**"
      - "!internal/uistate/**"
      - "deploy/kubernetes/**"
      - "tests/kubernetes/**"
      - "scripts/test-kubernetes.sh"
      - "Dockerfile"
      - "Dockerfile.vcsim"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: kubernetes-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kubernetes-e2e:
    name: Kubernetes deployment integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Build the same container inputs without running release packaging.
      - name: Build Linux amd64 test images
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o linux/amd64/vsfleet ./cmd/vsfleet
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o linux/amd64/vsfleet-vcsim ./cmd/vsfleet-vcsim
          docker build --build-arg TARGETPLATFORM=linux/amd64 -t vsfleet:ci-test .
          docker build -f Dockerfile.vcsim -t vsfleet-vcsim:ci-test .

      - name: Create Kubernetes test cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: vsfleet-ci
          version: v0.31.0
          kubectl_version: v1.35.0
          node_image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

      - name: Load local images into Kubernetes
        run: kind load docker-image --name vsfleet-ci vsfleet:ci-test vsfleet-vcsim:ci-test

      # The e2e fixture uses a kind-only hostPath PV. Unlike normal CSI-backed
      # volumes, hostPath does not apply the workload's fsGroup automatically.
      - name: Prepare writable Kubernetes test storage
        run: |
          docker exec vsfleet-ci-control-plane mkdir -p /var/lib/vsfleet-e2e-history
          docker exec vsfleet-ci-control-plane chown 65532:65532 /var/lib/vsfleet-e2e-history

      - name: Run Kubernetes end-to-end workload
        env:
          VSFLEET_K8S_DEBUG_DIR: ${{ runner.temp }}/kubernetes-debug
        # Reserve time for diagnostic collection and artifact upload.
        run: timeout --signal=TERM --kill-after=30s 12m ./scripts/test-kubernetes.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: kubernetes-debug
          path: ${{ runner.temp }}/kubernetes-debug
          if-no-files-found: warn
          retention-days: 14

