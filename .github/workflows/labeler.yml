name: Auto label

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply repository labels
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const managedLabels = {
              tui: {
                color: "1d76db",
                description: "Terminal UI and interactive operator experience"
              },
              assessment: {
                color: "5319e7",
                description: "Assessments, findings, health, history, drift, and trends"
              },
              compatibility: {
                color: "0e8a16",
                description: "RVTools interoperability and export compatibility"
              },
              vsphere: {
                color: "0052cc",
                description: "vSphere API, inventory collection, and resource mapping"
              },
              docs: {
                color: "0075ca",
                description: "Documentation and examples"
              },
              ci: {
                color: "6f42c1",
                description: "CI, GitHub Actions, and repository automation"
              },
              release: {
                color: "fbca04",
                description: "Release tooling, packaging, and versioning"
              },
              config: {
                color: "bfdadc",
                description: "Configuration, contexts, and operator settings"
              }
            };

            async function ensureLabelExists(name) {
              const spec = managedLabels[name];
              if (!spec) return;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: spec.color,
                  description: spec.description
                });
              }
            }

            // workflow_dispatch synchronizes all managed labels.
            if (context.eventName === "workflow_dispatch") {
              for (const name of Object.keys(managedLabels)) {
                await ensureLabelExists(name);
              }
              core.info("Managed labels are synchronized.");
              return;
            }

            const item = context.payload.pull_request ?? context.payload.issue;
            if (!item) {
              core.info("No issue or pull request payload to label.");
              return;
            }

            const labels = new Set();
            const title = (item.title ?? "").trim();
            const scopeMatch = title.match(/^[a-z]+(?:\(([a-z0-9_/-]+)\))?!?:/i);
            if (scopeMatch) {
              const type = title.split("(")[0].split(":")[0].toLowerCase();
              const scope = (scopeMatch[1] ?? "").toLowerCase();

              if (["tui", "ui"].includes(scope)) labels.add("tui");
              if (["health", "assessment", "readiness"].includes(scope)) labels.add("assessment");
              if (["compatibility", "report", "rvtools"].includes(scope)) labels.add("compatibility");
              if (["vsphere", "vcenter"].includes(scope)) labels.add("vsphere");
              if (["docs", "documentation"].includes(scope) || type === "docs") labels.add("docs");
              if (["ci", "workflow"].includes(scope) || type === "ci") labels.add("ci");
              if (["release", "goreleaser"].includes(scope)) labels.add("release");
              if (["config", "credentials", "context"].includes(scope)) labels.add("config");
            }

            if (context.payload.pull_request) {
              const pullNumber = context.payload.pull_request.number;
              const changedFiles = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100
                }
              );
              const paths = changedFiles.map((file) => file.filename);

              const anyPath = (predicate) => paths.some(predicate);
              const startsWithAny = (path, prefixes) =>
                prefixes.some((prefix) => path.startsWith(prefix));

              if (anyPath((path) =>
                startsWithAny(path, ["internal/tui/", "internal/uistate/"]) ||
                path.startsWith("internal/cli/tui") ||
                path === "docs/tui.md"
              )) labels.add("tui");

              if (anyPath((path) =>
                startsWithAny(path, ["internal/assessment/", "internal/health/"]) ||
                startsWithAny(path, ["internal/cli/assessment", "internal/cli/health"]) ||
                path === "docs/assessments.md"
              )) labels.add("assessment");

              if (anyPath((path) =>
                path.startsWith("internal/report/") ||
                /(?:rvtools|compatibility)/i.test(path)
              )) labels.add("compatibility");

              if (anyPath((path) => path.startsWith("internal/vsphere/"))) {
                labels.add("vsphere");
              }

              if (anyPath((path) =>
                path.startsWith("docs/") ||
                path === "README.md" ||
                path === "mkdocs.yml"
              )) labels.add("docs");

              if (anyPath((path) =>
                path.startsWith(".github/workflows/") ||
                path === ".github/dependabot.yml"
              )) labels.add("ci");

              if (anyPath((path) =>
                path === ".github/workflows/release.yml" ||
                path === "release-please-config.json" ||
                path === ".release-please-manifest.json" ||
                path === ".goreleaser.yml" ||
                path === "CHANGELOG.md"
              )) labels.add("release");

              if (anyPath((path) =>
                startsWithAny(path, ["internal/config/", "internal/contextops/"]) ||
                path === "docs/configuration.md"
              )) labels.add("config");
            } else {
              // Strip code blocks, inline code, and blockquotes to avoid false-positive keyword matches
              const rawBody = item.body ?? "";
              const sanitizedBody = rawBody
                .replace(/```[\s\S]*?```/g, "")
                .replace(/`[^`]+`/g, "")
                .replace(/^>.*$/gm, "");

              const text = `${title}\n${sanitizedBody}`.toLowerCase();

              const issueTextRules = {
                tui: [
                  /\btui\b/,
                  /terminal ui/,
                  /bubble tea/,
                  /\bkeybind(?:ing)?s?\b/,
                  /\bcursor\b/
                ],
                assessment: [
                  /\bassessment\b/,
                  /\bfindings?\b/,
                  /\bhealth evaluation\b/,
                  /\bdrift\b/,
                  /\btrends?\b/,
                  /\breadiness\b/
                ],
                compatibility: [
                  /\brvtools\b/,
                  /\binteroperability\b/,
                  /\bworksheet\b/,
                  /\bxlsx\b/
                ],
                vsphere: [
                  /\bvsphere\b/,
                  /\bvcenter\b/,
                  /\besxi\b/,
                  /\bgovmomi\b/,
                  /\bvapp\b/,
                  /\bdvswitch\b/,
                  /\bdvport\b/
                ],
                docs: [
                  /\bdocumentation\b/,
                  /\breadme\b/,
                  /\bdoc(?:s|umentation) update\b/
                ],
                ci: [
                  /\bgithub actions?\b/,
                  /\bcontinuous integration\b/,
                  /\bci\/cd\b/
                ],
                release: [
                  /\brelease please\b/,
                  /\bgoreleaser\b/,
                  /\bversion bump\b/
                ],
                config: [
                  /\bconfig\.toml\b/,
                  /\bkeyring\b/,
                  /\bcredentials?\b/,
                  /\bcontext configuration\b/,
                  /\bconnection context\b/,
                  /\boperator settings\b/
                ]
              };

              for (const [label, patterns] of Object.entries(issueTextRules)) {
                if (patterns.some((pattern) => pattern.test(text))) {
                  labels.add(label);
                }
              }
            }

            if (labels.size === 0) {
              core.info("No automatic labels matched.");
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [...labels].sort()
              });
            } catch (error) {
              // If any managed label is missing, create it on-demand and retry
              for (const label of labels) {
                if (managedLabels[label]) {
                  await ensureLabelExists(label);
                }
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: item.number,
                labels: [...labels].sort()
              });
            }

            core.info(`Applied labels: ${[...labels].sort().join(", ")}`);
