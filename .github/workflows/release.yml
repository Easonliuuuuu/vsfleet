name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check WinGet publishing token
        if: ${{ !contains(needs.release-please.outputs.tag_name, '-') }}
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          if [ -z "$WINGET_GITHUB_TOKEN" ]; then
            echo '::error::Set the WINGET_GITHUB_TOKEN Actions secret before releasing (fork-owner classic PAT with public_repo scope).'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      # Not go-version-file: setup-go reads go.mod's `go 1.26.0` as an exact
      # patch release, which shipped v0.6.2 and v0.6.3 with go1.26.0's
      # unpatched standard library. Keep this in step with ci.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Read the base image from the Dockerfile
        run: scripts/base-image-env.sh >> "$GITHUB_ENV"

      # Nothing is published until the source scan with this toolchain and
      # the pinned base image both pass. The final image is that base plus
      # the binary; CI's release-snapshot job scans the built image itself.
      - name: Install vulnerability scanners
        run: scripts/install-scanners.sh "${RUNNER_TEMP}/scanners" >> "$GITHUB_PATH"

      - name: Gate release on vulnerabilities
        env:
          RESULTS: ${{ runner.temp }}/vulnerability-results
        run: |
          failed=0
          scripts/vulnscan govulncheck "release source" "$RESULTS" ./... || failed=1
          for platform in linux/amd64 linux/arm64; do
            scripts/vulnscan grype "release base image ${platform}" "$RESULTS" \
              "registry:${BASE_IMAGE_NAME}@${BASE_IMAGE_DIGEST}" --platform "$platform" || failed=1
          done
          exit "$failed"

      - name: Keep scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-results-release
          path: ${{ runner.temp }}/vulnerability-results
          if-no-files-found: ignore
          retention-days: 90

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

      - name: Verify WinGet pull request
        if: ${{ !contains(needs.release-please.outputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          pr_url=$(gh api --method GET repos/microsoft/winget-pkgs/pulls \
            -f "head=Easonliuuuuu:vsfleet-${RELEASE_TAG#v}" -f state=all \
            --jq '[.[] | select(.state == "open" or .merged_at != null)][0].html_url // empty')
          if [ -z "$pr_url" ]; then
            echo '::error::GoReleaser did not open the WinGet PR; check its publishing logs.'
            exit 1
          fi
          printf 'WinGet submission: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve WinGet manifests on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: dist/winget
          if-no-files-found: ignore
