name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # The "What's new" popup and the top of the release page come from a
      # hand-written notes file per release. CI does not run on the release
      # pull request, so remind there, once per version, when it has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.pr != ''

      - name: Remind the release pull request about What's new notes
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r .number <<<"$RELEASE_PR")
          version=$(jq -r .title <<<"$RELEASE_PR" | sed -n 's/.* release v\{0,1\}\([0-9][0-9.]*\)$/\1/p')
          if [ -z "$version" ] || [ -f "internal/whatsnew/notes/$version.toml" ]; then
            exit 0
          fi
          echo "::warning::No What's new notes for $version: add internal/whatsnew/notes/$version.toml before merging the release pull request."
          marker="<!-- vsfleet-whats-new-missing $version -->"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --paginate --jq '.[].body' | grep -qF -- "$marker"; then
            exit 0
          fi
          gh pr comment "$number" --body "$marker
          No What's new notes for $version yet. Add \`internal/whatsnew/notes/$version.toml\` in its own pull request and merge it before this one. Without it, the upgrade popup and the top of the release page show only the version and its link."

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      # Not go-version-file: setup-go reads go.mod's `go 1.26.0` as an exact
      # patch release, which shipped v0.6.2 and v0.6.3 with go1.26.0's
      # unpatched standard library. Keep this in step with ci.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Read the base image from the Dockerfile
        run: scripts/base-image-env.sh >> "$GITHUB_ENV"

      # Nothing is published until the source scan with this toolchain and
      # the pinned base image both pass. The final image is that base plus
      # the binary; CI's release-snapshot job scans the built image itself.
      - name: Install vulnerability scanners
        run: scripts/install-scanners.sh "${RUNNER_TEMP}/scanners" >> "$GITHUB_PATH"

      - name: Gate release on vulnerabilities
        env:
          RESULTS: ${{ runner.temp }}/vulnerability-results
        run: |
          failed=0
          scripts/vulnscan govulncheck "release source" "$RESULTS" ./... || failed=1
          for platform in linux/amd64 linux/arm64; do
            scripts/vulnscan grype "release base image ${platform}" "$RESULTS" \
              "registry:${BASE_IMAGE_NAME}@${BASE_IMAGE_DIGEST}" --platform "$platform" || failed=1
          done
          exit "$failed"

      - name: Keep scan results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerability-results-release
          path: ${{ runner.temp }}/vulnerability-results
          if-no-files-found: ignore
          retention-days: 90

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Put the hand-written "What's new" notes at the top of the release, as
      # Markdown for people and as the JSON the upgrade prompt reads. A
      # release without a notes file keeps its generated notes alone.
      - name: Add What's new notes to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-body.md"
          # Built, not "go run": go run exits 1 whatever the program's own
          # exit status, which would hide the "no notes" status 3.
          go build -o "$RUNNER_TEMP/releasenotes" ./internal/whatsnew/releasenotes
          status=0
          "$RUNNER_TEMP/releasenotes" "$RELEASE_TAG" \
            < "$RUNNER_TEMP/release-body.md" > "$RUNNER_TEMP/release-notes.md" || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::No What's new notes for $RELEASE_TAG; the release keeps its generated notes."
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
