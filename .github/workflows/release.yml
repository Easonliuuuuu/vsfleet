name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check WinGet publishing token
        if: ${{ !contains(needs.release-please.outputs.tag_name, '-') }}
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          if [ -z "$WINGET_GITHUB_TOKEN" ]; then
            echo '::error::Set WINGET_GITHUB_TOKEN before releasing; see CONTRIBUTING.md#release-publishing.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

      - name: Verify WinGet pull request
        if: ${{ !contains(needs.release-please.outputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          pr_url=$(gh api --method GET repos/microsoft/winget-pkgs/pulls \
            -f "head=Easonliuuuuu:vsfleet-${RELEASE_TAG#v}" -f state=all \
            --jq '[.[] | select(.state == "open" or .merged_at != null)][0].html_url // empty')
          if [ -z "$pr_url" ]; then
            echo '::error::GoReleaser did not open the WinGet PR; check its publishing logs.'
            exit 1
          fi
          printf 'WinGet submission: %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve WinGet manifests on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: dist/winget
          if-no-files-found: ignore
