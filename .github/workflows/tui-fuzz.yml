name: TUI fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  fuzz:
    name: Extended TUI fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Fuzz key and resize sequences
        run: go test ./internal/tui -run '^$' -fuzz '^FuzzTUIKeyResizeNeverPanics$' -fuzztime 5m
      - name: Fuzz stale asynchronous messages
        run: go test ./internal/tui -run '^$' -fuzz '^FuzzStaleMessagesCannotReplaceNewerState$' -fuzztime 5m
      - name: Fuzz bounded rendering
        run: go test ./internal/tui -run '^$' -fuzz '^FuzzRenderIsBoundedAndDeterministic$' -fuzztime 5m
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-fuzz-artifacts
          path: |
            internal/tui/testdata/fuzz
            ${{ runner.temp }}/go-build
          if-no-files-found: ignore
