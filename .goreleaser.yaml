version: 2

project_name: vsfleet

before:
  hooks:
    - go mod tidy

builds:
  - id: vsfleet
    main: ./cmd/vsfleet
    binary: vsfleet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/easonliuuuuu/vsfleet/internal/version.Version={{ .Version }}
      - -X github.com/easonliuuuuu/vsfleet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/easonliuuuuu/vsfleet/internal/version.Date={{ .Date }}

archives:
  - id: vsfleet
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

homebrew_casks:
  - name: vsfleet
    ids:
      - vsfleet
    binaries:
      - vsfleet
    homepage: https://github.com/easonliuuuuu/vsfleet
    description: Operate multiple VMware vCenter servers from one terminal
    repository:
      owner: Easonliuuuuu
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing

changelog:
  disable: true
