version: 2

project_name: vcfleet

before:
  hooks:
    - go mod tidy

builds:
  - id: vcfleet
    main: ./cmd/vcfleet
    binary: vcfleet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/easonliuuuuu/vcfleet/internal/version.Version={{ .Version }}
      - -X github.com/easonliuuuuu/vcfleet/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/easonliuuuuu/vcfleet/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

release:
  mode: keep-existing

changelog:
  disable: true
